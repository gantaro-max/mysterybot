<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>問題の編集</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5" style="max-width: 800px;">
    
    <h2>問題の編集</h2>
    <hr>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/user/riddles/update}" method="post" enctype="multipart/form-data">
                <input type="hidden" name="id" th:value="${riddle.id}">
                
                <div class="mb-3">
                    <label class="form-label fw-bold">問題文</label>
                    <textarea name="question" class="form-control" rows="3" required th:text="${riddle.question}"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">画像</label>
                    
                    <div th:if="${riddle.imageId}" class="mb-2">
                        <img th:src="@{/public/image/{uuid}(uuid=${riddle.imageUuid})}"
                             class="img-thumbnail" style="max-height: 150px;">
                        <span class="text-muted ms-2 small">現在の画像</span>
                    </div>

                    <input type="file" name="imageFile" class="form-control" accept="image/*">
                    <div class="form-text">※新しい画像を選択すると上書きされます。変更しない場合はそのままでOKです。</div>
                </div>
                

                <div class="mb-3">
                    <label class="form-label fw-bold">ヒント</label>
                    <input type="text" name="hintMsg" class="form-control" th:value="${riddle.hintMsg}">
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">正解キーワード</label>
                        <input type="text" name="answer" class="form-control" required th:value="${riddle.answer}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">正解時のメッセージ</label>
                        <textarea name="nextMsg" class="form-control" rows="4" required th:text="${riddle.nextMsg}"></textarea>
                    </div>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="/user/riddles" class="btn btn-secondary">キャンセルして戻る</a>
                    
                    <button type="submit" class="btn btn-primary px-4">保存する</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
