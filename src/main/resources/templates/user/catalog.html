<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>問題カタログ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="container mt-4">
    <h2>📚 問題カタログ</h2>
    <p class="text-muted">既成の問題を、あなたのイベントに追加できます。</p>
    <a th:href="@{${backLink}}" class="btn btn-secondary mb-4">戻る</a>

    <div th:if="${isSuperAdmin}" class="card bg-light mb-5 border-danger">
        <div class="card-header bg-danger text-white">【管理者用】マスター問題作成</div>
        <div class="card-body">
            <form th:action="@{/admin/catalog/add-master}" method="post" enctype="multipart/form-data">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>問題文</label>
                        <textarea name="question" class="form-control" required></textarea>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>正解</label>
                        <input type="text" name="answer" class="form-control" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>次メッセージ</label>
                        <textarea name="nextMsg" class="form-control" required></textarea>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>ヒント</label>
                        <input type="text" name="hintMsg" class="form-control">
                    </div>
                </div>
                <div class="mb-3">
                    <label>カテゴリ</label>
                    <input type="text" name="category" class="form-control" value="一般">
                </div>
                <div class="mb-3">
                    <label>画像</label>
                    <input type="file" name="imageFile" class="form-control">
                </div>
                <button type="submit" class="btn btn-danger">カタログに追加</button>
            </form>
        </div>
    </div>

    <div class="row">
        <div class="col-md-4 mb-4" th:each="item : ${catalog}">
            <div class="card h-100 shadow-sm">
                <div th:if="${item.imageId}" style="height: 150px; overflow: hidden;">
                    <img th:src="@{/public/image/{id}(id=${item.imageId})}" class="card-img-top" style="object-fit: cover; height: 100%; width: 100%;">
                </div>
                
                <div class="card-body">
                    <span class="badge bg-info mb-2" th:text="${item.category}"></span>
                    <h5 class="card-title text-truncate" th:text="${item.question}"></h5>
                    <p class="card-text text-muted small">答え: <span th:text="${item.answer}"></span></p>
                    <p class="card-text small text-truncate" th:text="${item.nextMsg}"></p>
                </div>
                <div class="card-footer bg-white border-top-0">
                    <form th:action="@{/user/catalog/import}" method="post">
                        <input type="hidden" name="id" th:value="${item.id}">
                        <button type="submit" class="btn btn-outline-primary w-100">
                            <i class="bi bi-plus-circle me-1"></i>この問題を追加
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
