<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>シナリオ管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1>シナリオ編集: <span th:text="${groupId}"></span></h1>
    <a href="/admin" class="btn btn-secondary mb-4">← イベント一覧に戻る</a>

    <div class="card mb-4 border-primary">
        <div class="card-header bg-primary text-white">⚙️ イベント設定</div>
        <div class="card-body">
            <form action="/admin/riddles/settings" method="post" class="d-flex align-items-center">
                <input type="hidden" name="groupId" th:value="${groupId}">
                
                <div class="form-check form-switch me-4">
                    <input class="form-check-input" type="checkbox" id="randomSwitch" 
                           name="isRandom" value="true"
                           th:checked="${group.isRandomOrder}" style="cursor: pointer;">
                    <label class="form-check-label fw-bold" for="randomSwitch" style="cursor: pointer;">
                        ランダム出題モード
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-sm">設定を保存</button>
            </form>
            
            <div class="alert alert-light mt-3 mb-0 border p-2 small">
                <strong>ONの場合:</strong> 未回答の問題からランダムに出題されます。（チーム対抗戦などに推奨）<br>
                <strong>OFFの場合:</strong> 「No (StageNo)」の順番通りに出題されます。（ストーリー重視の場合に推奨）
            </div>
        </div>
    </div>
    <div class="card mb-4">
        <div class="card-header bg-light">新しい問題を追加</div>
        <div class="card-body">
            <form action="/admin/riddles/add" method="post">
                <input type="hidden" name="groupId" th:value="${groupId}">
                
                <div class="mb-3">
                    <label>問題文 (LINEで送信されます)</label>
                    <textarea name="question" class="form-control" rows="3" required></textarea>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>正解キーワード</label>
                        <input type="text" name="answer" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>正解時のメッセージ (次のストーリー)</label>
                        <textarea name="nextMsg" class="form-control" rows="1" required></textarea>
                    </div>
                </div>
                <button type="submit" class="btn btn-success">追加する</button>
            </form>
        </div>
    </div>

    <h3>登録済みの問題</h3>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>No</th>
                <th>問題文</th>
                <th>正解</th>
                <th>クリア後のメッセージ</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="riddle : ${riddles}">
                <td th:text="${riddle.stageNo}"></td>
                <td th:text="${riddle.question}"></td>
                <td th:text="${riddle.answer}"></td>
                <td th:text="${riddle.nextMsg}"></td>
                <td>
                    <a th:href="@{/admin/riddles/edit/{id}(id=${riddle.id})}" class="btn btn-sm btn-success">編集</a>
                    <form th:action="@{/admin/riddles/delete/{id}(id=${riddle.id})}" method="POST" style="display: inline;" onsubmit="return confirm('本当に削除しますか？');">
                        <button type="submit" class="btn btn-sm btn-danger">削除</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    <hr class="my-5">

    <h2>🏆 タイムアタックランキング</h2>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>順位</th>
                <th>チーム名/名前</th>
                <th>クリアタイム</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="player, stat : ${ranking}">
                <td th:text="${stat.count} + '位'">1位</td>
                <td th:text="${player.playerName}">名前</td>
                <td th:text="${player.getClearTime()}">05:30</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
