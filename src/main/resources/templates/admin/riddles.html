<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>シナリオ編集</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        
        /* テーブルの行をホバーした時のエフェクト */
        .table-hover tbody tr:hover {
            background-color: #e9ecef;
        }

        /* 長いテキストを「...」で省略する設定 */
        .text-truncate-box {
            max-width: 250px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: help; /* マウスを乗せると詳細が出るよ、というカーソル */
        }

        /* テーブルのヘッダーを固定する（スクロールしてもついてくる） */
        .sticky-header th {
            position: sticky;
            top: 0;
            background-color: #343a40; /* 背景色（黒） */
            color: white;
            z-index: 10;
        }
        
        /* テーブル全体をカード風にする */
        .table-container {
            max-height: 70vh; /* 画面の高さの70%まで */
            overflow-y: auto; /* それを超えたらスクロール */
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="p-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-0">
                <i class="bi bi-pencil-square me-2"></i>シナリオ編集
                <small class="text-muted fs-6 ms-2">ID: <span th:text="${group.groupId}"></span></small>
            </h2>
            <p class="text-muted mb-0 mt-1" th:text="${group.groupName}"></p>
        </div>
        <div>
            <a href="/admin/dashboard" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i>ダッシュボードに戻る
            </a>
            <a href="/admin/catalog" class="btn btn-warning ms-2">
                <i class="bi bi-book me-1"></i>カタログから選ぶ
            </a>
            <button type="button" class="btn btn-primary ms-2" data-bs-toggle="modal" data-bs-target="#addRiddleModal">
                <i class="bi bi-plus-lg me-1"></i>新しい問題を追加
            </button>
        </div>
    </div>

    <div class="card mb-4 border-0 shadow-sm">
        <div class="card-body d-flex align-items-center justify-content-between bg-white rounded">
            <div class="d-flex align-items-center">
                <div class="bg-light p-2 rounded-circle me-3 text-primary">
                    <i class="bi bi-gear-fill fs-4"></i>
                </div>
                <div>
                    <h6 class="mb-0 fw-bold">出題モード設定</h6>
                    <small class="text-muted" th:if="${group.isRandomOrder}">現在: <span class="badge bg-success">ランダム</span></small>
                    <small class="text-muted" th:unless="${group.isRandomOrder}">現在: <span class="badge bg-secondary">順番通り</span></small>
                </div>
            </div>
            
            <form action="/admin/riddles/settings" method="post" class="d-flex align-items-center">
                <div class="form-check form-switch me-3">
                    <input class="form-check-input" type="checkbox" id="randomSwitch" 
                           name="isRandom" value="true"
                           th:checked="${group.isRandomOrder}" style="cursor: pointer; width: 3em; height: 1.5em;">
                    <label class="form-check-label ms-2 mt-1" for="randomSwitch">ランダム出題モードを有効にする</label>
                </div>
                <button type="submit" class="btn btn-sm btn-outline-primary">設定保存</button>
            </form>
        </div>
    </div>

    <div class="table-container bg-white">
        <table class="table table-hover mb-0 align-middle">
            <thead class="sticky-header">
                <tr>
                    <th style="width: 50px;" class="text-center">No</th>
                    <th style="width: 30%;">問題文</th>
                    <th style="width: 15%;">正解</th>
                    <th style="width: 35%;">クリア後メッセージ</th>
                    <th style="width: 15%;" class="text-center">操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="riddle : ${riddles}">
                    <td class="text-center fw-bold" th:text="${riddle.stageNo}">1</td>
                    
                    <td>
                        <div class="text-truncate-box" th:text="${riddle.question}" 
                             data-bs-toggle="tooltip" th:title="${riddle.question}"></div>
                    </td>
                    
                    <td>
                        <span class="badge bg-light text-dark border" th:text="${riddle.answer}"></span>
                    </td>
                    
                    <td>
                        <div class="text-truncate-box text-muted small" th:text="${riddle.nextMsg}"
                             data-bs-toggle="tooltip" th:title="${riddle.nextMsg}"></div>
                    </td>
                    
                    <td class="text-center">
                        <div class="btn-group btn-group-sm">
                            <a th:href="@{/admin/riddles/edit/{id}(id=${riddle.id})}" class="btn btn-outline-success" title="編集">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/admin/riddles/delete/{id}(id=${riddle.id})}" method="POST" style="display: inline;" onsubmit="return confirm('本当に削除しますか？');">
                                <button type="submit" class="btn btn-outline-danger" title="削除">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                
                <tr th:if="${#lists.isEmpty(riddles)}">
                    <td colspan="5" class="text-center py-5 text-muted">
                        <i class="bi bi-inbox fs-1 d-block mb-3"></i>
                        まだ問題が登録されていません。<br>
                        右上の「新しい問題を追加」ボタンから登録してください。
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="modal fade" id="addRiddleModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title"><i class="bi bi-plus-circle me-2"></i>新しい問題を追加</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form action="/admin/riddles/add" method="post" enctype="multipart/form-data">
    
                        <div class="mb-3">
                            <label class="form-label fw-bold">問題文 (LINEで送信されます)</label>
                            <textarea name="question" class="form-control" rows="3" required placeholder="例: パンはパンでも..."></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">画像 (任意)</label>
                            <input type="file" name="imageFile" class="form-control" accept="image/*">
                            <div class="form-text">※jpg, pngなどが使えます。</div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">正解キーワード</label>
                                <input type="text" name="answer" class="form-control" required placeholder="例: フライパン">
                                <small class="text-muted">※カンマ区切りで複数可 (例: りんご,リンゴ)</small>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">正解時のメッセージ</label>
                                <textarea name="nextMsg" class="form-control" rows="3" required placeholder="例: 正解！次の手がかりは..."></textarea>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">ヒント (任意)</label>
                            <input type="text" name="hintMsg" class="form-control" placeholder="例: 台所にあるものです">
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                            <button type="submit" class="btn btn-primary px-4">追加する</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // マウスホバーでツールチップを表示するための初期化コード
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
        var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl)
        })
    </script>
</body>
</html>
