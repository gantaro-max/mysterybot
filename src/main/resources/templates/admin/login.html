<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>管理者ログイン</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .login-card { max-width: 400px; margin: 100px auto; }
    </style>
</head>
<body class="container">
    <div class="card shadow-sm login-card">
        <div class="card-body p-4">
            <h3 class="text-center mb-4">🧩 謎解きBot 管理画面</h3>
            
            <form action="/admin/login" method="post">
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                
                <div class="mb-3">
                    <label class="form-label">イベントID</label>
                    <input type="text" name="groupId" class="form-control" required placeholder="例: demo">
                </div>
                <div class="mb-3">
                    <label class="form-label">パスワード</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">ログイン</button>
            </form>
            
            <div class="text-center mt-3">
                <a href="/admin/register" class="text-decoration-none">新規イベント作成はこちら</a>
            </div>
        </div>
    </div>
</body>
</html>
