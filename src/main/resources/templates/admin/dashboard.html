<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>スーパーAdmin統合管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .god-mode { background-color: #2c3e50; color: white; }
        .table-hover tbody tr:hover { background-color: #f1f1f1; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark god-mode mb-4 shadow">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-shield-lock-fill me-2"></i>MysteryBot Super Admin
            </span>
            <div class="d-flex align-items-center">
                <span class="text-white-50 me-3">アプリケーション管理者</span>
                <a href="/auth/logout" class="btn btn-outline-light btn-sm">ログアウト</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3><i class="bi bi-list-stars me-2"></i>全イベント一覧</h3>
            <a href="/auth/register" class="btn btn-success">
                <i class="bi bi-plus-circle me-1"></i>新規イベント作成
            </a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th class="ps-4">イベントID</th>
                            <th>イベント名</th>
                            <th>パスワード</th>
                            <th>作成日時</th>
                            <th>状態</th>
                            <th class="text-end pe-4">アクション</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="event : ${events}" th:classappend="${event.groupId == 'admin'} ? 'table-warning'">
                            <td class="ps-4 fw-bold font-monospace" th:text="${event.groupId}"></td>
                            <td th:text="${event.groupName}"></td>
                            <td>
                                <span class="badge bg-secondary font-monospace" th:text="${event.adminPass}"></span>
                            </td>
                            <td class="small text-muted" th:text="${#temporals.format(event.createdAt, 'yyyy/MM/dd HH:mm')}"></td>
                            <td>
                                <span th:if="${event.startedAt != null}" class="badge bg-success">開催中</span>
                                <span th:if="${event.startedAt == null}" class="badge bg-secondary">準備中</span>
                            </td>
                            <td class="text-end pe-4">
                                <div class="d-flex justify-content-end gap-2">
                                    
                                    <form th:action="@{/admin/super/login/{id}(id=${event.groupId})}" method="post">
                                        <button type="submit" class="btn btn-primary btn-sm" title="管理画面へ侵入">
                                            <i class="bi bi-box-arrow-in-right me-1"></i>管理へ
                                        </button>
                                    </form>

                                    <form th:if="${event.groupId != 'admin'}" 
                                          th:action="@{/admin/super/delete/{id}(id=${event.groupId})}" 
                                          method="post" 
                                          onsubmit="return confirm('【警告】\n本当に削除しますか？\nこのイベントに関する全てのデータ（プレイヤー、履歴、問題）が消滅します。');">
                                        <button type="submit" class="btn btn-outline-danger btn-sm" title="完全削除">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
