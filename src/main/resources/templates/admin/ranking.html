<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ランキング</title>
    <meta http-equiv="refresh" content="10">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .rank-1 { font-size: 2rem; color: #ffd700; } /* 金 */
        .rank-2 { font-size: 1.8rem; color: #c0c0c0; } /* 銀 */
        .rank-3 { font-size: 1.6rem; color: #cd7f32; } /* 銅 */
    </style>
</head>
<body class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>🏆 <span th:text="${group.groupName}"></span> ランキング</h2>
        <a href="/admin/dashboard" class="btn btn-secondary">ダッシュボードへ戻る</a>
    </div>

    <table class="table table-striped table-hover text-center align-middle" style="font-size: 1.3rem;">
        <thead class="table-dark">
            <tr>
                <th style="width: 15%">順位</th>
                <th style="width: 55%">チーム名 / 名前</th>
                <th style="width: 30%">クリアタイム</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(ranking)}">
                <td colspan="3" class="text-muted p-5">まだクリアした人はいません...</td>
            </tr>
            
            <tr th:each="player, stat : ${ranking}">
                <td>
                    <span th:if="${stat.count == 1}" class="rank-1">🥇</span>
                    <span th:if="${stat.count == 2}" class="rank-2">🥈</span>
                    <span th:if="${stat.count == 3}" class="rank-3">🥉</span>
                    <span th:if="${stat.count > 3}" th:text="${stat.count} + '位'"></span>
                </td>
                <td th:text="${player.playerName}" class="fw-bold text-start ps-5"></td>
                <td th:text="${player.getClearTime()}"></td>
            </tr>
        </tbody>
    </table>
    
    <div class="text-end text-muted small mt-2">
        ※このページは10秒ごとに自動更新されます
    </div>
</body>
</html>
