<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>問題の編集</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1>問題を編集</h1>
    
    <form action="/admin/riddles/update" method="post">
        <input type="hidden" name="id" th:value="${riddle.id}">
        
        <div class="mb-3">
            <label>問題文</label>
            <textarea name="question" class="form-control" rows="3" required th:text="${riddle.question}"></textarea>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label>正解キーワード</label>
                <input type="text" name="answer" class="form-control" required th:value="${riddle.answer}">
            </div>
            <div class="col-md-6 mb-3">
                <label>正解時のメッセージ</label>
                <textarea name="nextMsg" class="form-control" rows="1" required th:text="${riddle.nextMsg}"></textarea>
            </div>
        </div>
        
        <button type="submit" class="btn btn-primary">更新を保存</button>
        <a th:href="@{/admin/riddles/{gid}(gid=${riddle.groupId})}" class="btn btn-secondary">キャンセル</a>
    </form>
</body>
</html>
