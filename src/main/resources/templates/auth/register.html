<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新規イベント作成</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .register-card { max-width: 500px; margin: 60px auto; }
    </style>
</head>
<body class="container">
    <div class="card shadow-sm register-card">
        <div class="card-body p-4">
            <h3 class="text-center mb-4">✨ 新規イベント作成</h3>
            
            <form th:action="@{/auth/register}" method="post">
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">イベントID (半角英数)</label>
                    <input type="text" name="groupId" class="form-control" required placeholder="例: wedding2024">
                    <div class="form-text">参加者が「開始 [ID]」と入力する際に使います。</div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">イベント名</label>
                    <input type="text" name="groupName" class="form-control" required placeholder="例: 〇〇結婚式二次会">
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">管理者パスワード</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                
                <button type="submit" class="btn btn-success w-100 py-2">イベントを作成して開始</button>
            </form>
            
            <div class="text-center mt-3">
                <a href="/auth/login" class="text-decoration-none">← ログイン画面に戻る</a>
            </div>
        </div>
    </div>
</body>
</html>
